name: Re-escanear

# Solo se ejecuta a mano: botón «Run workflow» en la pestaña Actions
# (la web enlaza aquí desde su botón «Re-escanear»).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escaneo
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Las fichas y auditorías se reutilizan 24 h entre ejecuciones.
      - name: Restaurar caché de las APIs
        uses: actions/cache@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Escanear
        run: python3 sniffer.py

      - name: Guardar resultados en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Escaneo $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Publicar en GitHub Pages (rama gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          cp -r docs/. "$tmp"
          cd "$tmp"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Escaneo $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
